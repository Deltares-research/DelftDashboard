# Reproducible DelftDashboard development/build environment (pixi).
#
#   pixi install            create/update the environment from pixi.lock
#   pixi run start          start DelftDashboard
#   pixi run build-exe      build the exe (console/debug build)
#
# The DelftDashboard / cht / hydromt / guitares repos are editable path
# dependencies: clone them next to this repo (e.g. C:\git\guitares), on the
# branches used for the build. All other packages are pinned to the versions
# of the tested delftdashboard_dev environment; pixi.lock pins exact builds.

[workspace]
name = "delftdashboard"
channels = ["conda-forge"]
platforms = ["win-64"]

[dependencies]
python = "==3.12.9"
nuitka = "==4.3"   # exe build
ffmpeg = "==9.0.2" # bundled with the exe for MP4 animation export
packaging = "==25.0"  # pinned on conda side to the tested PyPI version

[pypi-dependencies]
# Local repos (editable)
delftdashboard = { path = ".", editable = true }
cosmos = { path = "../cosmos", editable = true }
guitares = { path = "../guitares", editable = true }
cht-beware = { path = "../cht_beware", editable = true }
cht-cyclones = { path = "../cht_cyclones", editable = true }
cht-delft3dfm = { path = "../cht_delft3dfm", editable = true }
cht-meteo = { path = "../cht_meteo", editable = true }
