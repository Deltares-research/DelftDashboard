botocore = "==1.43.75"  # tested version; overrides narrower ranges in dependencies
pandas = "==3.0.6"  # tested version; overrides narrower ranges in dependencies
# Several repos' pyproject.toml request these packages from git URLs (main).
# Override them: local editable checkouts win, the rest come from PyPI at the
# tested versions. Without this, uv rejects the conflicting sources.
guitares = { path = "../guitares", editable = true }
cht-observations = { path = "../cht_observations", editable = true }
cht-cyclones = { path = "../cht_cyclones", editable = true }
cht-delft3dfm = { path = "../cht_delft3dfm", editable = true }
