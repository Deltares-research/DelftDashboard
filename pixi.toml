[tasks]
start = "python src/delftdashboard/start_delftdashboard.py"
build-exe = { cmd = "python build_delftdashboard.py --debug", cwd = "installer" }
build-exe-release = { cmd = "python build_delftdashboard.py", cwd = "installer" }
package = { cmd = "package_ddb.bat", cwd = "installer" }
