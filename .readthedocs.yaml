# Read the Docs configuration for DelftDashboard.
# https://docs.readthedocs.io/en/stable/config-file/v2.html
#
# The docs build is deliberately lightweight: conf.py reads the version from
# the source tree without importing the package, so only sphinx + theme are
# installed (see docs/requirements.txt).

version: 2

build:
  os: ubuntu-24.04
  tools:
    python: "3.12"

sphinx:
  configuration: docs/source/conf.py

python:
  install:
    - requirements: docs/requirements.txt
