gui_framework: pyside6
server_port: 3000
stylesheet: Diffnes.qss
title: Delft Dashboard
maximize: true
map_engine: maplibre
model:
  - name: sfincs_hmt
toolbox:
  - name: modelmaker_sfincs_hmt
    for_model: sfincs_hmt
  - name: bathymetry
  - name: drawing
  - name: visualization
    for_model: [sfincs_hmt]
# Training build: these features are shown greyed out (visible, not clickable).
# Remove an entry (or the whole list) to make it usable again.
disabled_features:
  - snapwave
  - urban_drainage
  - waves
# Training build: bathymetry datasets offered from the S3 (remote) catalog.
# Datasets in the local catalog (incl. user imports) and in the bundled
# extra catalogs are always shown. Remove the list to show all S3 datasets.
remote_bathymetry_datasets:
  - gebco_2024
# Catalog files shipped with the app (in the config folder), e.g. course data.
extra_bathymetry_catalogs:
  - training_bathymetry.yml
