element:
- style: panel
  title: Nourishments
  position:
    x: 10
    y: 10
    width: -10
    height: 165
  element:
  - style: checkbox
    text: Use nourishments
    position:
      x: 10
      y: 115
      width: 150
      height: 20
    variable: nourish
    method: set_model_variables
  - style: edit
    text: Nourishment file
    position:
      x: 185
      y: 115
      width: 150
      height: 20
    variable: norfile
    method: set_model_variables
  - style: listbox
    position:
      x: 10
      y: 10
      width: 110
      height: 85
    variable: active_nourishments
    select: index
    option_string:
      variable: nourishments_names
  - style: pushbutton
    text: Draw
    position:
      x: 130
      y: 10
      width: 70
      height: 20
    method: draw_nourishments
  - style: pushbutton
    text: Delete
    position:
      x: 130
      y: 35
      width: 70
      height: 20
    method: delete_nourishments
  - style: pushbutton
    text: Load
    position:
      x: 130
      y: 60
      width: 70
      height: 20
    method: load_nourishments
  - style: pushbutton
    text: Save
    position:
      x: 130
      y: 85
      width: 70
      height: 20
    method: save_nourishments
  - style: edit
    text: Start
    position:
      x: 470
      y: 35
      width: 70
      height: 20
    variable: nourishment_tstart
    method: set_model_variables
  - style: edit
    text: End
    position:
      x: 470
      y: 60
      width: 70
      height: 20
    variable: nourishment_tend
    method: set_model_variables
  - style: edit
    text: Volume
    position:
      x: 470
      y: 85
      width: 70
      height: 20
    variable: nourishment_totalvolume
    method: set_model_variables
  - style: edit
    text: Growth
    position:
      x: 470
      y: 110
      width: 70
      height: 20
    variable: growth
    method: set_model_variables
