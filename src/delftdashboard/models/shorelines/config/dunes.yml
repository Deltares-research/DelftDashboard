element:
- style: panel
  title: Dunes
  position:
    x: 10
    y: 10
    width: -10
    height: 165
  element:
  - style: edit
    text: Dune file
    position:
      x: 130
      y: 115
      width: 100
      height: 20   
    text_position: above-left
    variable: ldbdune
    method: set_model_variables
  - style: checkbox
    text: Use dunes
    position:
      x: 10
      y: 125
      width: 100
      height: 20
    variable: dune
    method: set_model_variables
  - style: listbox
    position:
      x: 10
      y: 10
      width: 110
      height: 110
    method: select_dune_from_list
    variable: active_dunes
    select: index
    option_string:
      variable: dunes_names
  - style: pushbutton
    text: Add
    position:
      x: 130
      y: 10
      width: 70
      height: 20
    method: add_dune_point_on_map
  - style: pushbutton
    text: Delete
    position:
      x: 130
      y: 35
      width: 70
      height: 20
    method: delete_dune
  - style: pushbutton
    text: Load
    position:
      x: 130
      y: 60
      width: 70
      height: 20
    method: load_dunes
  - style: pushbutton
    text: Save
    position:
      x: 130
      y: 85
      width: 70
      height: 20
    method: save_dunes
  - style: edit
