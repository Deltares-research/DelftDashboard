element:
- style: panel
  text: Wind
  position:
    x: 10
    y: 10
    width: 230
    height: 160
  element:
  - style: popupmenu
    text: Source
    position:
      x: 60
      y: 130
      width: 160
      height: 20
    variable: wind_source
    option_value:
      variable: wind_source_values
    option_string:
      variable: wind_source_names
    method: select_wind_source
    tooltip: Source of the wind forcing
    text_position: left
  - style: pushselectfile
    position:
      x: 10
      y: 95
      width: 210
      height: 20
    text: Wind File
    variable: wndfile
    showfilename: True
    filter: "Wind file (*.wnd)"
    title: Select wind file
    tooltipstring: Uniform wind time series (magnitude and direction)
    method: set_model_variables
    dependency:
    - action: visible
      checkfor: all
      check:
      - variable: wind_source
        operator: eq
        value: uniform
  - style: pushselectfile
    position:
      x: 10
      y: 95
      width: 210
      height: 20
    text: AMU File
    variable: amufile
    showfilename: True
    extension: "*.amu"
    title: Select AMU file
    tooltipstring: Gridded wind u-component (Delft3D ASCII)
    filter: "AMU file (*.amu)"
    method: set_model_variables
    dependency:
    - action: visible
      checkfor: all
      check:
      - variable: wind_source
        operator: eq
        value: gridded
  - style: pushselectfile
    position:
      x: 10
      y: 60
      width: 210
      height: 20
    text: AMV File
    variable: amvfile
    showfilename: True
    extension: "*.amv"
    title: Select AMV file
    tooltipstring: Gridded wind v-component (Delft3D ASCII)
    filter: "AMV file (*.amv)"
    method: set_model_variables
    dependency:
    - action: visible
      checkfor: all
      check:
      - variable: wind_source
        operator: eq
        value: gridded
  - style: pushselectfile
    position:
      x: 10
      y: 95
      width: 210
      height: 20
    text: NetCDF File
    variable: netamuamvfile
    showfilename: True
    extension: "*.nc"
    title: Select NetCDF wind file
    tooltipstring: Combined gridded wind u/v components (NetCDF)
    filter: "NetCDF file (*.nc)"
    method: set_model_variables
    dependency:
    - action: visible
      checkfor: all
      check:
      - variable: wind_source
        operator: eq
        value: netcdf
- style: panel
  text: Spiderweb
  position:
    x: 250
    y: 10
    width: 230
    height: 160
  element:
  - style: pushselectfile
    position:
      x: 10
      y: 130
      width: 210
      height: 20
    text: SPW File
    variable: spwfile
    showfilename: True
    extension: "*.spw"
    title: Select spiderweb file
    tooltipstring: Tropical cyclone spiderweb file (ASCII or NetCDF)
    filter: "Spiderweb file (*.spw *.nc)"
    method: set_model_variables
  - style: edit
    text: Merge fraction
    position:
      x: 130
      y: 95
      width: 60
      height: 20
    variable: spwmergefrac
    method: set_model_variables
    tooltip: Merge factor between the spiderweb and the background wind field
    text_position: left
- style: panel
  text: Parameters
  position:
    x: 490
    y: 10
    width: 230
    height: 160
  element:
  - style: edit
    text: Update interval (s)
    position:
      x: 130
      y: 130
      width: 60
      height: 20
    variable: dtwnd
    method: set_model_variables
    tooltip: Update interval of the 2D wind forcing (s)
    text_position: left
  - style: checkbox
    position:
      x: 10
      y: 100
      width: 210
      height: 20
    text: Spin up meteo
    variable: spinup_meteo
    method: set_model_variables
    tooltip: Ramp the wind up from zero during the spin-up interval
