element:
- style: panel
  title: Spectral Domain
  position:
    x: 10
    y: 10
    width: 140
    height: 160
  element:
  - style: edit
    position:
      x: 80
      y: 130
      width: 50
      height: 20
    text: Freq Min (Hz)
    variable: freqmin
    method: set_model_variables
    tooltipstring: Edit lowest frequency (Hz)
  - style: edit
    position:
      x: 80
      y: 105
      width: 50
      height: 20
    text: Freq Max (Hz)
    variable: freqmax
    method: set_model_variables
    tooltipstring: Edit highest frequency (Hz)
  - style: edit
    position:
      x: 80
      y: 80
      width: 50
      height: 20
    text: Frequency Bins
    variable: nsigma
    method: set_model_variables
    tooltipstring: Edit number of frequency bins
  - style: edit
    position:
      x: 80
      y: 55
      width: 50
      height: 20
    text: Directional Bins
    variable: ntheta
    method: set_model_variables
    tooltipstring: Edit number of directional bins
- style: panel
  title: Limiters
  position:
    x: 160
    y: 10
    width:  120
    height: 160
  element:
  - style: edit
    position:
      x: 60
      y: 130
      width: 50
      height: 20
    text: Dmx1 (-)
    variable: dmx1
    method: set_model_variables
    tooltipstring: Edit DMX1
- style: panel
  title: Time Integration
  position:
    x: 290
    y: 10
    width: 180
    height: 160
  element:
  - style: edit
    position:
      x: 110
      y: 130
      width: 60
      height: 20
    text: Spin-up Time (s)
    variable: tspinup
    method: set_model_variables
    tooltipstring: Duration of the spin-up period in seconds
  - style: edit
    position:
      x: 110
      y: 105
      width: 60
      height: 20
    text: Alpha (-)
    variable: alpha
    method: set_model_variables
    tooltipstring: CFL Courant factor for the propagation time step
  - style: popupmenu
    position:
      x: 110
      y: 80
      width: 60
      height: 20
    text: Scheme
    variable: propagation_scheme
    method: set_model_variables
    option_string:
    - Upwind 1
    - Upwind 2
    option_value:
    - 1
    - 2
    tooltipstring: 'Propagation scheme: 1st or 2nd order upwind'
