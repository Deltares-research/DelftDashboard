element:
- style: panel
  title: Output
  id: output_panel
  position:
    x: 10
    y: 10
    width: -10
    height: 160
  element:
  - style: edit
    position:
      x: 120
      y: 130
      width: 80
      height: 20
    tooltipstring: Edit map output interval (in seconds)
    text: Map output interval (s)
    textposition: left
    variable: dtmapout
    method: set_model_variables
  - style: edit
    position:
      x: 120
      y: 105
      width: 80
      height: 20
    tooltipstring: Edit max output interval (in seconds)
    text: Max output interval (s)
    textposition: left
    variable: dtmaxout
    method: set_model_variables
  - style: edit
    position:
      x: 120
      y: 80
      width: 80
      height: 20
    tooltipstring: Edit history output interval (in seconds)
    text: His output interval (s)
    textposition: left
    variable: dthisout
    method: set_model_variables
  - style: edit
    id: rst_int
    position:
      x: 120
      y: 55
      width: 80
      height: 20
    tooltipstring: Edit restart output interval (in seconds)
    text: Restart output interval (s)
    textposition: left
    variable: dtrstout
    method: set_model_variables
  - style: popupmenu
    id: output_format
    position:
      x: 120
      y: 30
      width: 80
      height: 20
    text: Output Format
    variable: outputformat
    method: set_model_variables
    option_string:
      variable: output_options_text
    option_value:
      variable: output_options_values
    tooltipstring: Select the output file format
  - style: checkbox
    position:
      x: 220
      y: 130
    text: Store Meteo
    variable: storemeteo
    method: set_model_variables
    tooltipstring: Check to include meteo data in model output
  - style: checkbox
    position:
      x: 220
      y: 105
    text: Store Velocity
    variable: storevel
    method: set_model_variables
    tooltipstring: Check to include velocity data in model output
  - style: checkbox
    position:
      x: 220
      y: 80
    text: Store Cumulative Precipitation
    variable: storecumprcp
    method: set_model_variables
    tooltipstring: Check to include cumulative precipitation in model output
  - style: checkbox
    position:
      x: 220
      y: 55
    text: Store Max Velocity
    variable: storevelmax
    method: set_model_variables
    tooltipstring: Check to store the maximum velocity
