- style: panel
  text: Spiderweb
  position:
    x: 400
    y: 10
    width: 120
    height: 160
  element:
  - style: pushselectfile
    position:
      x: 10
      y: 130
      width: 100
      height: 20
    text: SPW File
    variable: spwfile
    showfilename: True
    extension: "*.spw"
    title: Select spiderweb file
    tooltipstring: Tropical cyclone spiderweb file (wind, pressure and optionally rain)
    filter: "Spiderweb file (*.spw)"
    method: set_model_variables
  - style: pushselectfile
    position:
      x: 10
      y: 95
      width: 100
      height: 20
    text: NetCDF SPW File
    variable: netspwfile
    showfilename: True
    extension: "*.nc"
    title: Select NetCDF spiderweb file
    tooltipstring: Tropical cyclone spiderweb file (NetCDF)
    filter: "NetCDF file (*.nc)"
    method: set_model_variables
  - style: edit
    text: Merge fraction
    position:
      x: 80
      y: 60
      width: 30
      height: 20
    variable: spwmergefrac
    method: set_model_variables
    tooltip: Merge factor between the spiderweb and the background wind field
    text_position: left
  - style: edit
    text: Size factor
    position:
      x: 80
      y: 35
      width: 30
      height: 20
    variable: factor_spw_size
    method: set_model_variables
    tooltip: Scaling factor on the spiderweb radius
    text_position: left
  - style: checkbox
    position:
      x: 10
      y: 10
      width: 100
      height: 20
    text: Use precipitation
    variable: usespwprecip
    method: set_model_variables
    tooltip: Use the precipitation field from the spiderweb file
