element:
- style: panel
  text: Wind
  position:
    x: 10
    y: 10
    width: 120
    height: 160
  element:
  - style: popupmenu
    position:
      x: 10
      y: 130
      width: 100
      height: 20
    variable: wind_source
    option_value:
      variable: wind_source_values
    option_string:
      variable: wind_source_names
    method: select_wind_source
    tooltip: Source of the wind forcing
    text_position: left
  - style: pushselectfile
    position:
      x: 10
      y: 95
      width: 100
      height: 20
    text: Wind File
    variable: wndfile
    showfilename: True
    filter: "Wind file (*.wnd)"
    title: Select wind file
    tooltipstring: Uniform wind time series (magnitude and direction)
    method: set_model_variables
    dependency:
    - action: visible
      checkfor: all
      check:
      - variable: wind_source
        operator: eq
        value: uniform
  - style: pushselectfile
    position:
      x: 10
      y: 95
      width: 100
      height: 20
    text: AMU File
    variable: amufile
    showfilename: True
    extension: "*.amu"
    title: Select AMU file
    tooltipstring: Gridded wind u-component (Delft3D ASCII)
    filter: "AMU file (*.amu)"
    method: set_model_variables
    dependency:
    - action: visible
      checkfor: all
      check:
      - variable: wind_source
        operator: eq
        value: gridded
  - style: pushselectfile
    position:
      x: 10
      y: 60
      width: 100
      height: 20
    text: AMV File
    variable: amvfile
    showfilename: True
    extension: "*.amv"
    title: Select AMV file
    tooltipstring: Gridded wind v-component (Delft3D ASCII)
    filter: "AMV file (*.amv)"
    method: set_model_variables
    dependency:
    - action: visible
      checkfor: all
      check:
      - variable: wind_source
        operator: eq
        value: gridded
  - style: pushselectfile
    position:
      x: 10
      y: 95
      width: 100
      height: 20
    text: NetCDF File
    variable: netamuamvfile
    showfilename: True
    extension: "*.nc"
    title: Select NetCDF wind file
    tooltipstring: Combined gridded wind u/v components (NetCDF)
    filter: "NetCDF file (*.nc)"
    method: set_model_variables
    dependency:
    - action: visible
      checkfor: all
      check:
      - variable: wind_source
        operator: eq
        value: netcdf
